<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Добавление материала</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0000FF}a:hover{color:#0000B3}
</style>

</head>
<body>
<div style="width: 1440px; height: 900px; box-sizing: border-box; font-family: 'TT Norms Pro', Manrope, system-ui, sans-serif; color: #000000; background: #8C8C99; display: flex; justify-content: center; align-items: flex-start; gap: 40px; padding: 64px 40px;">

  <div role="dialog" aria-label="Добавить ссылку" style="width: 560px; background: #FFFFFF; border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(0,0,40,0.25);">
    <div style="display: flex; align-items: center; gap: 12px; padding: 24px 28px 0;">
      <h2 style="margin: 0; font-size: 26px; font-weight: 400; margin-right: auto;">Добавить материал</h2>
      <a href="04-product.html" aria-label="Закрыть" style="width: 40px; height: 40px; border-radius: 8px; background: #F2F2FE; color: #000000; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>
    <div style="padding: 20px 28px 24px; display: flex; flex-direction: column; gap: 18px;">
      <div role="group" aria-label="Ссылка или файл" style="display: flex; background: #E0E0F5; border-radius: 8px; padding: 4px; gap: 2px;">
        <button type="button" aria-pressed="true" style="flex: 1; height: 38px; border: 0; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; color: #0000FF;">Ссылка</button>
        <button type="button" aria-pressed="false" style="flex: 1; height: 38px; border: 0; border-radius: 6px; background: transparent; font: inherit; font-size: 14px; color: #000000;">Файл</button>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #44445C;">Адрес ссылки
        <input type="url" value="https://www.figma.com/file/…" style="height: 44px; border: 1px solid #0000FF; border-radius: 8px; padding: 0 12px; font: inherit; font-size: 15px; font-weight: 400; color: #000000;">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #44445C;">Название
        <input type="text" value="Макеты и креативы" style="height: 44px; border: 1px solid #8A8AC2; border-radius: 8px; padding: 0 12px; font: inherit; font-size: 15px; font-weight: 400; color: #000000;">
        <span style="font-size: 12px; font-weight: 400; color: #5C5C73;">Подставили из ссылки — можно поменять</span>
      </label>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #44445C;">Продукт
          <select style="height: 44px; border: 1px solid #8A8AC2; border-radius: 8px; padding: 0 10px; font: inherit; font-size: 15px; font-weight: 400; color: #000000; background: #FFFFFF;"><option>TATLIN.UNIFIED G3</option></select>
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #44445C;">Тип материала
          <select style="height: 44px; border: 1px solid #8A8AC2; border-radius: 8px; padding: 0 10px; font: inherit; font-size: 15px; font-weight: 400; color: #000000; background: #FFFFFF;"><option>Макеты</option><option>Презентации</option><option>Визуалы</option><option>Документы</option><option>Тексты</option><option>Сайт</option><option>Другое</option></select>
        </label>
      </div>
      <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 32px;"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #0000FF; margin: 0;">Закрепить в карточке продукта</label>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 10px; padding: 18px 28px; border-top: 1px solid #E0E0F5;">
      <a href="04-product.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border: 1px solid #8A8AC2; border-radius: 8px; color: #000000; font-size: 15px; text-decoration: none;">Отмена</a>
      <a href="04-product.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 22px; border-radius: 8px; background: #0000FF; color: #FFFFFF; font-size: 15px; font-weight: 500; text-decoration: none;">Добавить</a>
    </div>
  </div>

  <div role="dialog" aria-label="Загрузить файл" style="width: 560px; background: #FFFFFF; border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(0,0,40,0.25);">
    <div style="display: flex; align-items: center; gap: 12px; padding: 24px 28px 0;">
      <h2 style="margin: 0; font-size: 26px; font-weight: 400; margin-right: auto;">Добавить материал</h2>
      <a href="04-product.html" aria-label="Закрыть" style="width: 40px; height: 40px; border-radius: 8px; background: #F2F2FE; color: #000000; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>
    <div style="padding: 20px 28px 24px; display: flex; flex-direction: column; gap: 18px;">
      <div role="group" aria-label="Ссылка или файл" style="display: flex; background: #E0E0F5; border-radius: 8px; padding: 4px; gap: 2px;">
        <button type="button" aria-pressed="false" style="flex: 1; height: 38px; border: 0; border-radius: 6px; background: transparent; font: inherit; font-size: 14px; color: #000000;">Ссылка</button>
        <button type="button" aria-pressed="true" style="flex: 1; height: 38px; border: 0; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; color: #0000FF;">Файл</button>
      </div>
      <div style="border: 1.5px dashed #9999E0; border-radius: 8px; padding: 26px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; background: #F2F2FE;">
        <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0000FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0-4 4m4-4 4 4M5 20h14"></path></svg>
        <span style="font-size: 15px;">Перетащите файлы или <span style="color: #0000FF;">выберите на компьютере</span></span>
        <span style="font-size: 13px; color: #5C5C73;">PDF, PPTX, DOCX, XLSX, изображения, ZIP — до 200 МБ</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; gap: 12px; align-items: center;">
          <span style="width: 40px; height: 40px; border-radius: 6px; background: #F2F2FE; color: #0000FF; font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center;">PPTX</span>
          <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">
            <div style="display: flex; justify-content: space-between; font-size: 14px;"><span>Презентация продукта.pptx</span><span style="color: #5C5C73; font-size: 13px;">64%</span></div>
            <div style="height: 4px; border-radius: 2px; background: #E0E0F5;"><div style="width: 64%; height: 4px; border-radius: 2px; background: #0000FF;"></div></div>
          </div>
          <button type="button" aria-label="Отменить загрузку" style="width: 40px; height: 40px; border: 0; border-radius: 6px; background: transparent; color: #44445C; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
        </div>
        <div style="display: flex; gap: 10px; background: #F2F2FE; border-radius: 8px; padding: 12px; font-size: 13px; line-height: 1.45; color: #000000;">
          <svg aria-hidden="true" style="flex: none; margin-top: 1px;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0000FF" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
          <span>Файл с таким именем уже есть. Сохраним его как версию 4, версия 3 останется в истории</span>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #44445C;">Продукт
          <select style="height: 44px; border: 1px solid #8A8AC2; border-radius: 8px; padding: 0 10px; font: inherit; font-size: 15px; font-weight: 400; color: #000000; background: #FFFFFF;"><option>TATLIN.UNIFIED G3</option></select>
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #44445C;">Тип материала
          <select style="height: 44px; border: 1px solid #8A8AC2; border-radius: 8px; padding: 0 10px; font: inherit; font-size: 15px; font-weight: 400; color: #000000; background: #FFFFFF;"><option>Презентации</option><option>Макеты</option><option>Визуалы</option><option>Документы</option><option>Тексты</option><option>Сайт</option><option>Другое</option></select>
        </label>
      </div>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 10px; padding: 18px 28px; border-top: 1px solid #E0E0F5;">
      <a href="04-product.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border: 1px solid #8A8AC2; border-radius: 8px; color: #000000; font-size: 15px; text-decoration: none;">Отмена</a>
      <a href="04-product.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 22px; border-radius: 8px; background: #0000FF; color: #FFFFFF; font-size: 15px; font-weight: 500; text-decoration: none;">Загрузить</a>
    </div>
  </div>
</div>
</body>
</html>
