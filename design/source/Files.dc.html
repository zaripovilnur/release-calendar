  </nav>

  <sc-if value="{{navOpen}}" hint-placeholder-val="{{ true }}">

        <span style="font-size: 13px; color: #5C5C73;">Календарь релизов</span>

    </div>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 8px; color: #000000; font-size: 15px; text-decoration: none;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Календарь</a>

        <span style="font-size: 15px; color: #44445C;">Все материалы по продуктам в одном месте</span>
      </div>
      <label style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #8A8AC2; border-radius: 8px; padding: 0 12px; height: 44px; width: 300px; max-width: 100%; box-sizing: border-box; color: #5C5C73;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Поиск материала</span><input type="search" placeholder="Название файла или ссылки" style="border: 0; outline: 0; font: inherit; font-size: 14px; background: transparent; flex: 1; min-width: 0; color: #000000;"></label>
      <a href="AddMaterial.dc.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 8px; background: #0000FF; color: #FFFFFF; font-size: 14px; font-weight: 500; text-decoration: none;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Добавить материал</a>
    </header>

    <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
      <div role="group" aria-label="Вид материалов" style="display: flex; background: #E0E0F5; border-radius: 8px; padding: 4px; gap: 2px;">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
          <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="{{t.style}}">{{t.label}}</button>
        </sc-for>
      </div>
      <button type="button" style="height: 36px; padding: 0 14px; border: 1px solid #8A8AC2; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 13px; color: #000000;">Направление: все ▾</button>
      <button type="button" style="height: 36px; padding: 0 14px; border: 1px solid #8A8AC2; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 13px; color: #000000;">Продукт: все ▾</button>
      <button type="button" style="height: 36px; padding: 0 14px; border: 1px solid #8A8AC2; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 13px; color: #000000; margin-left: auto;">Сначала новые ▾</button>
    </div>

    <section aria-label="Материалы" style="background: #FFFFFF; border-radius: 12px; overflow-x: auto;">
      <div style="min-width: 900px;">
        <div style="display: grid; grid-template-columns: 48px minmax(0, 2.4fr) 1fr 1.4fr 1.1fr 48px; gap: 16px; padding: 14px 24px; border-bottom: 1px solid #E0E0F5; font-size: 13px; font-weight: 500; color: #5C5C73;">
          <span></span><span>Название</span><span>Тип</span><span>Продукт</span><span>Добавлено</span><span></span>
        </div>
        <sc-for list="{{items}}" as="i" hint-placeholder-count="10">
          <div style="display: grid; grid-template-columns: 48px minmax(0, 2.4fr) 1fr 1.4fr 1.1fr 48px; gap: 16px; align-items: center; padding: 12px 24px; border-bottom: 1px solid #F2F2FE;">
            <span style="width: 44px; height: 44px; border-radius: 6px; background: #F2F2FE; color: #0000FF; font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center;">{{i.badge}}</span>
            <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;"><span style="font-size: 15px;">{{i.name}}</span><span style="font-size: 12px; color: #5C5C73;">{{i.note}}</span></div>
            <span style="font-size: 14px; color: #44445C;">{{i.cat}}</span>
            <a href="Product.dc.html" style="font-size: 16px; font-weight: 300; line-height: 1.25; color: #0000FF; text-decoration: none;">{{i.product}}</a>
            <span style="font-size: 13px; color: #5C5C73;">{{i.when}}</span>
            <button type="button" aria-label="{{i.action}}" style="width: 40px; height: 40px; border: 1px solid #E0E0F5; border-radius: 6px; background: #FFFFFF; color: #000000; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{i.icon}}"></path></svg></button>
          </div>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>

class Component extends DCLogic {

    var st = this.state || {};

      var on = t[0] === tab;
      return { label: t[1], pressed: on ? 'true' : 'false', pick: function () { self.setState({ tab: t[0] }); },
